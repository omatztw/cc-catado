# Fly.io configuration for Socket.io server
# See https://fly.io/docs/reference/configuration/

app = "catado-server"
primary_region = "nrt"  # Tokyo region

[build]
  dockerfile = "Dockerfile.server"

[env]
  NODE_ENV = "production"
  SOCKET_PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Health check
[checks]
  [checks.health]
    port = 3001
    type = "http"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
